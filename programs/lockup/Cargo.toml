[package]
name = "lockup"
version = "0.1.0"
description = "LOCKUP - sealed-bid storage units on Solana + MagicBlock"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "lockup"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []

[dependencies]
anchor-lang = { version = "=1.0.2", features = ["init-if-needed"] }
anchor-spl = { version = "=1.0.2" }
ephemeral-rollups-sdk = { version = "0.16.2", features = ["anchor", "access-control", "vrf"] }
solana-sha256-hasher = "3.1.0"
